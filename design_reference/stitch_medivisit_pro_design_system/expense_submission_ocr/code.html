<style>
        /* Custom Animations */
        @keyframes shimmer-sweep {
            0% { transform: translateX(-100%) skewX(-15deg); }
            100% { transform: translateX(200%) skewX(-15deg); }
        }
        .animate-shimmer {
            position: relative;
            overflow: hidden;
        }
        .animate-shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.4) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: shimmer-sweep 2s infinite;
            z-index: 10;
        }
        
        @keyframes glow-pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .animate-glow {
            animation: glow-pulse 3s ease-in-out infinite;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
        }
        
        .ai-tint-panel {
            background: rgba(221, 225, 255, 0.25); /* tertiary-fixed with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(193, 197, 227, 0.4); /* tertiary-fixed-dim */
        }

        /* Hide scrollbar for cleaner look */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col">
<!-- Task-Focused Header (Suppressed Global Nav per rules) -->
<header class="sticky top-0 z-50 glass-panel border-b border-surface-variant/50 px-edge py-4 flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Submit Expense</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-edge pt-stack-lg pb-[120px] max-w-3xl mx-auto w-full space-y-stack-lg">
<!-- Image Capture & Processing Area (Bento Layout) -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Camera Zone -->
<div class="relative h-[200px] rounded-xl border-2 border-dashed border-primary/30 bg-surface-container-lowest/40 flex flex-col items-center justify-center overflow-hidden group hover:border-primary/50 transition-colors">
<!-- Soft Background Glow -->
<div class="absolute w-32 h-32 bg-primary/10 rounded-full blur-2xl animate-glow"></div>
<span class="material-symbols-outlined text-[40px] text-primary mb-3 relative z-10" style="font-variation-settings: 'FILL' 0;">photo_camera</span>
<button class="relative z-10 px-6 py-2 rounded-full bg-gradient-to-r from-surface-container-high to-surface-variant border border-outline-variant/30 shadow-sm flex items-center gap-2 hover:shadow-md transition-shadow">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">add</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Scan Receipt</span>
</button>
</div>
<!-- Processing Thumbnail -->
<div class="relative h-[200px] rounded-xl border border-outline-variant/40 bg-surface-container shadow-[0_8px_24px_rgba(0,0,0,0.04)] overflow-hidden animate-shimmer">

<!-- OCR Overlay Graphic -->
<div class="absolute inset-0 border-[3px] border-tertiary/40 m-4 rounded-lg flex items-center justify-center bg-surface-container/20 backdrop-blur-[2px]">
<div class="bg-surface/90 backdrop-blur-md px-4 py-2 rounded-full shadow-lg border border-tertiary-fixed-dim/50 flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-tertiary animate-spin" style="animation-duration: 3s;">document_scanner</span>
<span class="font-label-sm text-label-sm text-tertiary uppercase tracking-wider">Processing...</span>
</div>
</div>
</div>
</section>
<!-- AI Auto-filled Fields -->
<section class="space-y-stack-sm">

<div class="grid grid-cols-1 sm:grid-cols-2 gap-stack-sm">

<option disabled="" selected="" value="">Select category...</option>
<option selected="" value="meals">Client Meals &amp; Entertainment</option>
<option value="travel">Travel &amp; Transit</option>
<option value="supplies">Medical Supplies</option>

</div>

</section>
