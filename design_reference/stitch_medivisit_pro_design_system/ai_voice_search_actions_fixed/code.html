<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediVisit Pro - Smart Search</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#b3c5ff",
                        "surface-container-low": "#f0f3ff",
                        "on-tertiary-fixed": "#151a31",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#fffeff",
                        "tertiary-fixed": "#dde1ff",
                        "surface-variant": "#dce2f3",
                        "surface": "#f9f9ff",
                        "on-secondary-fixed": "#00201a",
                        "on-error": "#ffffff",
                        "primary-container": "#1a6bff",
                        "outline-variant": "#c2c6d8",
                        "secondary-fixed-dim": "#44ddc1",
                        "primary-fixed": "#dae1ff",
                        "tertiary-fixed-dim": "#c1c5e3",
                        "primary-fixed-dim": "#b3c5ff",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#003fa4",
                        "surface-container": "#e7eefe",
                        "inverse-on-surface": "#ebf1ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f9f9ff",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#68fadd",
                        "on-surface": "#151c27",
                        "on-secondary-container": "#007261",
                        "secondary-container": "#68fadd",
                        "surface-container-high": "#e2e8f8",
                        "secondary": "#006b5c",
                        "background": "#f9f9ff",
                        "primary": "#0053d3",
                        "tertiary": "#575c76",
                        "outline": "#727687",
                        "on-tertiary-container": "#fffeff",
                        "on-secondary-fixed-variant": "#005145",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#707490",
                        "on-surface-variant": "#424655",
                        "surface-dim": "#d3daea",
                        "inverse-surface": "#2a313d",
                        "surface-tint": "#0055d5",
                        "surface-container-highest": "#dce2f3",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#001849",
                        "on-tertiary-fixed-variant": "#41455f",
                        "on-background": "#151c27"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "stack-md": "16px",
                        "edge": "20px",
                        "card-padding": "16px",
                        "stack-sm": "8px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "display": ["Inter"],
                        "stats-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "display": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "stats-lg": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "headline-lg": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "21px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        .glass-bg {
            background: rgba(249, 249, 255, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
                box-shadow: 0 0 20px rgba(138, 43, 226, 0.2), inset 0 0 20px rgba(138, 43, 226, 0.2);
            }
            50% {
                transform: scale(1.1);
                opacity: 0.3;
                box-shadow: 0 0 40px rgba(138, 43, 226, 0.1), inset 0 0 40px rgba(138, 43, 226, 0.1);
            }
        }
        .text-gradient {
            background: linear-gradient(135deg, #8a2be2, #1a6bff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-lg min-h-screen relative overflow-hidden flex flex-col justify-center items-center">
<!-- Clean clinical futurism background gradient -->
<div class="absolute inset-0 bg-gradient-to-br from-surface-bright via-surface-container-low to-surface-container z-0"></div>
<!-- Full screen container -->
<div class="absolute inset-0 z-10 flex flex-col justify-between items-center p-edge">
<!-- Top spacing -->
<div class="w-full flex justify-end">
</div>
<!-- Center Active Voice Area -->
<div class="flex flex-col items-center max-w-lg w-full text-center space-y-stack-lg z-20 mt-12">
<h1 class="text-headline-lg font-headline-lg text-gradient animate-pulse mb-8">Listening...</h1>
<!-- Voice Activity Ring -->
<div class="relative w-48 h-48 flex justify-center items-center">
<div class="absolute inset-0 rounded-full border-4 border-[#8a2be2]/20 pulse-ring"></div>
<div class="absolute inset-4 rounded-full border-2 border-[#1a6bff]/30 pulse-ring" style="animation-delay: 0.2s"></div>
<div class="w-24 h-24 rounded-full bg-gradient-to-tr from-[#8a2be2] to-[#1a6bff] flex justify-center items-center shadow-[0_0_30px_rgba(138,43,226,0.3)]">
<span class="material-symbols-outlined text-white text-5xl" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
</div>
<!-- Transcript -->
<div class="px-card-padding py-stack-lg bg-surface-container-highest/30 rounded-2xl backdrop-blur-xl border border-white/60 w-full mt-stack-lg shadow-[0_8px_32px_rgba(0,0,0,0.03)] glass-bg">
<p class="text-headline-md font-headline-md text-on-surface glow-text leading-snug">
                    "Find Dr. Sharma's last visit notes and share the LipoStat PDF."
                </p>
</div>
</div>
<!-- Predicted Actions Area -->
<div class="w-full max-w-md space-y-stack-sm z-20 mb-auto mt-12 flex flex-col gap-3">
<p class="text-label-sm font-label-sm text-outline uppercase tracking-wider pl-2">Predicted Actions</p>
<!-- Action Card 1 -->
<button class="w-full flex items-center justify-between p-card-padding bg-surface/80 hover:bg-surface transition-all rounded-xl border border-white/60 shadow-[0_4px_16px_rgba(0,0,0,0.03)] backdrop-blur-xl group glass-bg">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex justify-center items-center group-hover:bg-primary-container/30 transition-colors">
<span class="material-symbols-outlined text-primary-container">description</span>
</div>
<div class="text-left">
<p class="text-body-lg font-body-lg font-semibold text-on-surface">Open Notes</p>
<p class="text-body-md font-body-md text-on-surface-variant">Dr. Sharma</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Action Card 2 -->
<button class="w-full flex items-center justify-between p-card-padding bg-surface/80 hover:bg-surface transition-all rounded-xl border border-white/60 shadow-[0_4px_16px_rgba(0,0,0,0.03)] backdrop-blur-xl group glass-bg">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-[#8a2be2]/10 flex justify-center items-center group-hover:bg-[#8a2be2]/20 transition-colors">
<span class="material-symbols-outlined text-[#8a2be2]">send</span>
</div>
<div class="text-left">
<p class="text-body-lg font-body-lg font-semibold text-on-surface">Send LipoStat PDF</p>
<p class="text-body-md font-body-md text-on-surface-variant">To: Dr. Sharma</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-[#8a2be2] transition-colors">chevron_right</span>
</button>
</div>
<!-- Bottom Controls -->
<div class="w-full max-w-md flex justify-between items-center z-20 pb-8 mt-8">
<button class="w-12 h-12 rounded-full bg-surface-container-highest/40 hover:bg-surface-container-highest flex justify-center items-center border border-white/60 transition-colors backdrop-blur-md shadow-sm">
<span class="material-symbols-outlined text-on-surface-variant">keyboard</span>
</button>
<button class="text-body-lg font-body-lg font-semibold text-error hover:text-on-error-container transition-colors px-6 py-3 rounded-full hover:bg-error-container/20">
                Cancel
            </button>
</div>
</div>
</body></html>
