<!DOCTYPE html>

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0,0,0,0.06);
        }
        
        .leave-chip {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(200, 210, 230, 0.5);
            transition: all 0.2s ease;
        }
        
        .leave-chip[aria-selected="true"] {
            background: linear-gradient(135deg, theme('colors.primary'), theme('colors.primary-container'));
            color: white;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(26, 107, 255, 0.4);
            transform: translateY(-1px);
        }
        
        .leave-chip[aria-selected="false"]:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: theme('colors.primary-fixed-dim');
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(200, 210, 230, 0.6);
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .input-glass:focus-within {
            background: rgba(255, 255, 255, 0.8);
            border-color: theme('colors.primary');
            box-shadow: 0 0 0 2px rgba(26, 107, 255, 0.2);
        }

        .gradient-text {
            background: linear-gradient(135deg, theme('colors.primary'), theme('colors.surface-tint'));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .upload-zone {
            background: rgba(240, 243, 255, 0.3);
            border: 2px dashed theme('colors.primary-fixed-dim');
            transition: all 0.2s ease;
        }
        
        .upload-zone:hover {
            background: rgba(240, 243, 255, 0.6);
            border-color: theme('colors.primary');
            box-shadow: 0 0 20px rgba(26, 107, 255, 0.1) inset;
        }

        .submit-btn {
            background: linear-gradient(135deg, theme('colors.primary'), theme('colors.primary-container'));
            box-shadow: 0 4px 15px rgba(26, 107, 255, 0.3), 0 0 20px rgba(26, 107, 255, 0.2) inset;
            transition: all 0.2s ease;
        }
        
        .submit-btn:hover {
            box-shadow: 0 6px 20px rgba(26, 107, 255, 0.4), 0 0 25px rgba(26, 107, 255, 0.3) inset;
            transform: translateY(-1px);
        }
        
        .submit-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(26, 107, 255, 0.3);
        }

        /* Hide TopAppBar bottom border as per rule */
        .no-border-header { border-bottom: none !important; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen font-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed pb-32">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-edge h-16 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md shadow-sm full-width top-0 sticky no-border-header z-40">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-variant flex items-center justify-center ring-2 ring-primary-fixed">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="Professional headshot of a medical sales representative, bright lighting, corporate healthcare setting, smiling, modern light-mode UI style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCNhdDJ36Y19kizJGzWEcwP5C-DvJFCvfeGgipEWiWJ_Gz9TECro0p7zt6XaC0cH9iNVd2CLCeRld_jxQGz6gkJcz1RsmpTl5bR4texyYxYok0b2vJ65TWj-6Gqd5ASCB4SOIEgSa5Iou7h6xcz4Harjptx-JGB7kulslfvjDeKXk01nV0Z5ylqJi_H_7Xbazgh8CdMgBtYI2v4uGZio5U-awAfd9zTwlkiSqjlt0dFE_EasBzyyz_VBIWmprafxrauh5vL0e6Q3Yty"/>
</div>
<h1 class="font-headline-lg text-headline-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">MediVisit Pro</h1>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high transition-colors active:scale-95 duration-150 ease-in-out">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</header>
<main class="max-w-2xl mx-auto px-edge mt-stack-lg">
<div class="mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Request Leave</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Submit your time off request for approval.</p>
</div>
<form class="glass-panel rounded-xl p-card-padding space-y-stack-lg relative overflow-hidden">
<!-- Subtle decorative background element -->
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary-fixed rounded-full mix-blend-multiply filter blur-3xl opacity-30 pointer-events-none"></div>
<!-- Leave Type -->
<section>
<label class="block font-label-sm text-label-sm text-on-surface mb-stack-sm uppercase tracking-wide">Leave Type</label>
<div aria-label="Leave Type" class="flex flex-wrap gap-3" role="radiogroup">
<button aria-checked="true" aria-selected="true" class="leave-chip px-5 py-2.5 rounded-full font-label-sm text-label-sm text-on-surface font-semibold flex items-center gap-2" role="radio" type="button">
<span class="material-symbols-outlined text-[18px]">beach_access</span>
                        Casual
                    </button>
<button aria-checked="false" aria-selected="false" class="leave-chip px-5 py-2.5 rounded-full font-label-sm text-label-sm text-on-surface font-semibold flex items-center gap-2" role="radio" type="button">
<span class="material-symbols-outlined text-[18px]">sick</span>
                        Sick
                    </button>
<button aria-checked="false" aria-selected="false" class="leave-chip px-5 py-2.5 rounded-full font-label-sm text-label-sm text-on-surface font-semibold flex items-center gap-2" role="radio" type="button">
<span class="material-symbols-outlined text-[18px]">emergency</span>
                        Emergency
                    </button>
<button aria-checked="false" aria-selected="false" class="leave-chip px-5 py-2.5 rounded-full font-label-sm text-label-sm text-on-surface font-semibold flex items-center gap-2" role="radio" type="button">
<span class="material-symbols-outlined text-[18px]">more_horiz</span>
                        Other
                    </button>
</div>
</section>
<!-- Date Range -->
<section>
<div class="flex items-center justify-between mb-stack-sm">
<label class="block font-label-sm text-label-sm text-on-surface uppercase tracking-wide">Date Range</label>
<div class="bg-primary-fixed-dim/20 border border-primary-fixed px-3 py-1 rounded-full flex items-center gap-1.5 backdrop-blur-sm">
<span class="material-symbols-outlined text-[14px] text-primary">schedule</span>
<span class="font-label-sm text-label-sm font-bold gradient-text">3 days</span>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- From Date -->
<div class="input-glass rounded-lg p-3 relative group">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="date-from">From</label>
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-primary-fixed/50 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
</div>
<input class="bg-transparent border-none p-0 focus:ring-0 font-body-md text-on-surface w-full outline-none" id="date-from" type="date" value="2023-10-25"/>
</div>
</div>
<!-- To Date -->
<div class="input-glass rounded-lg p-3 relative group">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="date-to">To</label>
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-secondary-container/50 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">event</span>
</div>
<input class="bg-transparent border-none p-0 focus:ring-0 font-body-md text-on-surface w-full outline-none" id="date-to" type="date" value="2023-10-27"/>
</div>
</div>
</div>
</section>
<!-- Reason -->
<section>
<label class="block font-label-sm text-label-sm text-on-surface mb-stack-sm uppercase tracking-wide" for="reason">Reason</label>
<textarea class="w-full input-glass rounded-lg p-3 font-body-md text-on-surface resize-none focus:outline-none" id="reason" placeholder="Provide a brief explanation..." rows="3"></textarea>
</section>
<!-- Document Upload -->
<section>
<label class="block font-label-sm text-label-sm text-on-surface mb-stack-sm uppercase tracking-wide">Supporting Documents <span class="text-on-surface-variant font-normal normal-case">(Optional)</span></label>
<div class="upload-zone rounded-xl p-6 flex flex-col items-center justify-center text-center cursor-pointer relative overflow-hidden">
<input aria-label="Upload document" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" type="file"/>
<div class="w-12 h-12 rounded-full bg-surface mb-3 flex items-center justify-center text-primary shadow-sm ring-1 ring-primary-fixed">
<span class="material-symbols-outlined text-[24px]">cloud_upload</span>
</div>
<p class="font-label-sm text-label-sm text-primary mb-1">Click to upload or drag and drop</p>
<p class="font-body-md text-[12px] text-on-surface-variant">PDF, JPG, or PNG (max. 5MB)</p>
</div>
</section>
<!-- Submit Action -->
<div class="pt-stack-sm">
<button class="submit-btn w-full h-12 rounded-lg font-label-sm text-label-sm text-white uppercase tracking-wider flex items-center justify-center gap-2" type="button">
                    Submit Request
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-6 left-0 right-0 z-50 flex justify-around items-center px-4 py-3 bg-surface-container/70 dark:bg-inverse-surface/70 backdrop-blur-lg shadow-[0px_4px_20px_rgba(0,0,0,0.08)] max-w-md mx-auto w-[calc(100%-40px)] rounded-full border border-outline-variant/20 md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity w-16" href="#">
<span class="material-symbols-outlined mb-1">medical_services</span>
<span class="font-label-sm text-[10px]">Inventory</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity w-16" href="#">
<span class="material-symbols-outlined mb-1">event_note</span>
<span class="font-label-sm text-[10px]">Visits</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity w-16" href="#">
<span class="material-symbols-outlined mb-1">analytics</span>
<span class="font-label-sm text-[10px]">Analytics</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full w-14 h-14 -mt-2 shadow-lg scale-90 duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-sm text-[10px] mt-0.5">Settings</span>
</a>
</nav>
<script>
        // Simple interaction for leave chips
        document.querySelectorAll('.leave-chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                // Reset all chips
                document.querySelectorAll('.leave-chip').forEach(c => {
                    c.setAttribute('aria-selected', 'false');
                    c.setAttribute('aria-checked', 'false');
                });
                // Set clicked chip
                e.currentTarget.setAttribute('aria-selected', 'true');
                e.currentTarget.setAttribute('aria-checked', 'true');
            });
        });
    </script>
</body></html>
