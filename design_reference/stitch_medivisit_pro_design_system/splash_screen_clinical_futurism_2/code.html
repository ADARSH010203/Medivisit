<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Custom Splash Background */
        body {
            background-color: #0A0E1A; /* Requested Dark Navy Override */
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Ambient Blobs */
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.2;
            z-index: 0;
            animation: float-blob 10s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: #1A6BFF;
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            width: 600px;
            height: 600px;
            background: #00BFA5;
            bottom: -200px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float-blob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* Logo Animation */
        .logo-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fade-in-up 1s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .logo-image {
            width: 140px;
            height: 140px;
            border-radius: 32px;
            box-shadow: 0 16px 48px rgba(0, 191, 165, 0.15), inset 0 2px 4px rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 24px;
            object-fit: contain;
            animation: pulse-glow 3s infinite ease-in-out;
            position: relative;
        }

        .logo-pedestal {
            position: absolute;
            bottom: -20px;
            width: 200px;
            height: 40px;
            background: radial-gradient(ellipse at center, rgba(0, 191, 165, 0.3) 0%, rgba(26, 107, 255, 0) 70%);
            border-radius: 50%;
            filter: blur(10px);
            z-index: -1;
            animation: pulse-shadow 3s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 16px 48px rgba(0, 191, 165, 0.15), inset 0 2px 4px rgba(255, 255, 255, 0.1); transform: scale(1); }
            50% { box-shadow: 0 24px 64px rgba(26, 107, 255, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.2); transform: scale(1.02); }
        }
        
        @keyframes pulse-shadow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        @keyframes fade-in-up {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typography Override for Splash */
        .splash-title {
            background: linear-gradient(135deg, #ffffff 0%, #a3c2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 40px;
            margin-bottom: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 36px;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .splash-subtitle {
            color: #8da2c0; /* Muted gray-blue */
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 16px;
            letter-spacing: 0.02em;
            text-align: center;
        }

        /* Progress Bar */
        .progress-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            z-index: 10;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1A6BFF, #00BFA5);
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(0, 191, 165, 0.6);
            animation: load-progress 2.5s ease-out forwards;
        }

        @keyframes load-progress {
            0% { width: 0%; }
            40% { width: 60%; }
            80% { width: 85%; }
            100% { width: 100%; }
        }
        
        /* Layout constraint for mobile preview centering if needed */
        .splash-canvas {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.querySelector('.progress-bar');
            progressBar.addEventListener('animationend', () => {

            });
        });
