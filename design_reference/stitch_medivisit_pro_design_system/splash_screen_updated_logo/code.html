<style>
        .loading-bar {
            width: 0%;
            animation: load 2.5s ease-in-out forwards;
        }

        @keyframes load {
            0% { width: 0%; opacity: 0; }
            10% { opacity: 1; }
            50% { width: 60%; }
            100% { width: 100%; }
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 1s ease-out 0.5s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .pulse-slow {
            animation: pulseSlow 3s infinite;
        }

        @keyframes pulseSlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
    </style>
</head>
<body class="bg-gradient-to-b from-[#F7F9FC] to-[#EBF1FF] min-h-screen flex flex-col justify-between items-center relative overflow-hidden font-body-md text-on-background">

            MediVisit Pro
        </h1>
<!-- Tagline -->
<p class="font-body-md text-body-md text-on-surface-variant text-center opacity-80 font-medium">
            Field Excellence, Simplified

</main>
<!-- Bottom Spacer & Loading Indicator -->
<div class="w-full flex-1 flex flex-col justify-end items-center pb-12 z-10">

</div>
