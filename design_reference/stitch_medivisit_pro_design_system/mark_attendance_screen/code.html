<script>
        // Simple clock update
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('current-time').innerHTML = `${hours}:${minutes} <span class="font-headline-md text-headline-md text-on-surface-variant">${ampm}</span>`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Interaction logic for attendance marking
        let isMarked = false;
        function toggleAttendance(element) {
            if (isMarked) return; // Prevent double-marking for this demo
            
            const ring = document.getElementById('attendance-ring');
            const inner = document.getElementById('attendance-inner');
            const icon = document.getElementById('attendance-icon');
            const label = document.getElementById('attendance-label');
            const statusText = document.getElementById('status-text');
            const todayDot = document.getElementById('today-dot');

            // Haptic feedback simulation
            if(navigator.vibrate) navigator.vibrate(50);

            // Transforming to marked state
            ring.className = 'attendance-button-ring shadow-[0_0_30px_rgba(104,250,221,0.5)] transition-all duration-500 scale-100';
            ring.style.background = 'linear-gradient(135deg, #007261, #68fadd)';
            
            inner.className = 'w-48 h-48 rounded-full flex flex-col items-center justify-center gap-2 relative z-10 bg-gradient-to-br from-secondary to-secondary-container overflow-hidden transition-all duration-500';
            
            icon.innerHTML = 'check_circle';
            icon.className = 'material-symbols-outlined text-6xl text-on-secondary-container drop-shadow-md scale-110 transition-all duration-500';
            icon.style.fontVariationSettings = "'FILL' 1";
            
            label.innerText = 'Marked In';
            label.className = 'font-headline-md text-headline-md text-on-secondary-container font-bold';

            statusText.innerText = 'Attendance captured successfully';
            statusText.className = 'font-body-md text-body-md text-secondary font-medium mt-4';

            todayDot.className = 'w-2 h-2 rounded-full bg-secondary shadow-[0_0_8px_rgba(0,107,92,0.6)] transition-all duration-300';

            isMarked = true;
            
            // Add sparkle elements dynamically
            for(let i=0; i<5; i++) {
                createSparkle(element);
            }
        }

        function createSparkle(parent) {
            const sparkle = document.createElement('div');
            sparkle.className = 'absolute w-2 h-2 bg-white rounded-full shadow-[0_0_10px_white] z-20 pointer-events-none';
            
            // Random positioning around the button
            const angle = Math.random() * Math.PI * 2;
            const radius = 80 + Math.random() * 30;
            const x = Math.cos(angle) * radius + 96; // 96 is half of w-48
            const y = Math.sin(angle) * radius + 96;
            
            sparkle.style.left = `${x}px`;
            sparkle.style.top = `${y}px`;
            
            // Basic animation via JS
            sparkle.animate([
                { transform: 'scale(0) translate(0,0)', opacity: 1 },
                { transform: `scale(1) translate(${Math.cos(angle)*20}px, ${Math.sin(angle)*20}px)`, opacity: 0 }
            ], {
                duration: 800 + Math.random() * 400,
                easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
            });

            parent.querySelector('#attendance-inner').appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 1200);
        }
    </script>
