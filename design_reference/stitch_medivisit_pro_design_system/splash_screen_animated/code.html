<style>
        .mesh-bg {
            background-color: #fdf7ff;
            background-image: 
                radial-gradient(at 10% 20%, rgba(79, 55, 138, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(103, 80, 164, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(207, 188, 255, 0.15) 0px, transparent 50%);
            background-size: 150% 150%;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(0,0,0,0.04);
        }

        .progress-bar {
            width: 0%;
            background: linear-gradient(90deg, #4f378a, #6750a4);
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: translateX(-100%);
        }

        .fade-in-up, .stagger-fade, .scale-entrance {
            opacity: 0;
        }

        @media (prefers-reduced-motion: no-preference) {
            .mesh-bg {
                animation: mesh-animation 15s ease infinite alternate;
            }

            .progress-bar {
                animation: progress 2.5s cubic-bezier(0.65, 0, 0.35, 1) forwards;
            }

            .progress-bar::after {
                animation: shimmer 2s infinite;
            }

            .fade-in-up {
                animation: fadeInUp 0.8s ease-out forwards;
            }

            .stagger-fade {
                animation: staggerFade 0.6s ease-out forwards;
            }

            .scale-entrance {
                animation: scaleEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            }

            .pulse-glow {
                animation: pulseGlow 2s infinite alternate;
            }

            .bounce {
                animation: bounce 2s infinite;
            }

            .path-draw {
                stroke-dasharray: 100;
                stroke-dashoffset: 100;
                animation: pathDraw 1s ease-out forwards;
            }
            
            .shared-axis-x {
                animation: sharedAxisX 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            }

            .stagger-1 { animation-delay: 0.1s; }
            .stagger-2 { animation-delay: 0.2s; }
            .stagger-3 { animation-delay: 0.3s; }
            .stagger-4 { animation-delay: 0.4s; }
        }

        @keyframes mesh-animation {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        @keyframes progress {
            0% { width: 0%; }
            40% { width: 45%; }
            70% { width: 85%; }
            100% { width: 100%; }
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes staggerFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleEntrance {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 0 0 rgba(79, 55, 138, 0.4); }
            to { box-shadow: 0 0 20px 10px rgba(79, 55, 138, 0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pathDraw {
            from { stroke-dashoffset: 100; }
            to { stroke-dashoffset: 0; }
        }
        
        @keyframes sharedAxisX {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Shared logic for spring scale on buttons/fab (even if none exist on this specific screen)
        const interactables = document.querySelectorAll('button, .btn, .fab');
        interactables.forEach(el => {
            el.addEventListener('mousedown', () => {
                el.style.transform = 'scale(0.95)';
                el.style.transition = 'transform 0.1s ease';
            });
            const resetScale = () => {
                el.style.transform = 'scale(1)';
                el.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
            };
            el.addEventListener('mouseup', resetScale);
            el.addEventListener('mouseleave', resetScale);
            
            // Touch events for mobile
            el.addEventListener('touchstart', () => {
                el.style.transform = 'scale(0.95)';
                el.style.transition = 'transform 0.1s ease';
            }, {passive: true});
            el.addEventListener('touchend', resetScale);
        });
    });
</script>
