<img alt="Umakind Pharma Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAF3PdPEqTDW5hXT_D0kfU1h67VHTXL-8QtPSRSgn7wMg3B8NoeDMl5fy7NVZO6MwCEtVyDPE_1nA0xAn9rMKHQ9ah_QzpmZ1HY2mzS7ID91vSvz-YBnZgX7vQo1EncILJwhTGy5SS1bCH-HmAZhR0vAIBaCMmkfAH1fhTGo5H9hJIWFNuzSjxh7-2vlNKwkDg49gogB-oZesmx7xPn9I5ibE6HLFK2K4JhsgiSy0CreVh68rwOu9965hexCUB8DHJHul9_-ilAb_1h"/>

<h1 class="font-headline-lg text-headline-lg text-on-background mb-stack-sm">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your field work</p>
</div>
<form class="w-full flex flex-col gap-stack-md">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-fixed-dim transition-shadow font-body-md text-body-md" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-10 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-fixed-dim transition-shadow font-body-md text-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors flex items-center justify-center" id="togglePassword" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="font-label-sm text-label-sm text-primary-container hover:underline hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<button class="w-full h-12 bg-primary-container text-on-primary-container font-label-sm text-label-sm rounded-lg mt-stack-sm hover:opacity-90 active:scale-95 transition-all duration-200 flex items-center justify-center shadow-md" type="submit">
                Sign In
            </button>
</form>
<div class="w-full flex items-center gap-4 my-stack-lg">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-outline uppercase">OR</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>
<div class="text-center mb-stack-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                New Employee? <a class="text-primary-container font-semibold hover:underline" href="#">Register here</a>
</p>
</div>
<div class="mt-auto pt-stack-md flex items-center gap-2 bg-success-container/10 px-4 py-2 rounded-full border border-outline-variant/30 text-secondary">
<span class="material-symbols-outlined text-sm" data-icon="shield" data-weight="fill" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="font-label-sm text-label-sm">Secure company login</span>
</div>
</main>
<script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const icon = togglePassword.querySelector('span');

        togglePassword.addEventListener('click', function (e) {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if(type === 'password') {
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            } else {
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            }
        });
    </script>
