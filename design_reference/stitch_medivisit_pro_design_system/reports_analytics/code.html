<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .duotone-icon {
            position: relative;
            display: inline-flex;
        }
        .duotone-icon::after {
            content: attr(data-icon);
            font-family: 'Material Symbols Outlined';
            position: absolute;
            inset: 0;
            color: theme('colors.primary-fixed');
            filter: drop-shadow(0 0 4px theme('colors.primary-fixed/50'));
            opacity: 0.5;
            z-index: -1;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: theme('colors.white/10'); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: theme('colors.white/20'); }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md overflow-x-hidden flex">
<!-- Global Level 0 Mesh Background -->
<div class="fixed inset-0 pointer-events-none z-0 opacity-5">
<div class="absolute top-0 left-0 w-1/2 h-1/2 bg-primary-fixed rounded-full mix-blend-screen filter blur-[150px]"></div>
<div class="absolute bottom-0 right-0 w-1/2 h-1/2 bg-secondary-container rounded-full mix-blend-screen filter blur-[150px]"></div>
</div>
<!-- SideNavBar Component -->
<nav class="fixed left-0 top-0 h-full w-[280px] bg-surface-dim/80 backdrop-blur-[30px] border-r border-white/10 shadow-2xl flex flex-col gap-stack-md py-margin-page z-50 transition-all duration-300 ease-in-out hidden md:flex">
<div class="px-gutter mb-stack-md">
<h1 class="font-headline-md text-headline-md font-bold text-primary-fixed drop-shadow-[0_0_8px_rgba(0,219,231,0.5)]">MediVisit Pro</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Clinical Admin Console</p>
</div>
<div class="flex flex-col font-body-md text-body-md w-full">
<a class="text-on-surface-variant hover:text-on-surface py-3 px-4 transition-all hover:bg-white/5 flex items-center gap-3 mx-2 rounded-xl" href="#">
<span class="material-symbols-outlined duotone-icon" data-icon="dashboard">dashboard</span> Dashboard
            </a>
<a class="text-on-surface-variant hover:text-on-surface py-3 px-4 transition-all hover:bg-white/5 flex items-center gap-3 mx-2 rounded-xl" href="#">
<span class="material-symbols-outlined duotone-icon" data-icon="group">group</span> Patients
            </a>
<a class="text-on-surface-variant hover:text-on-surface py-3 px-4 transition-all hover:bg-white/5 flex items-center gap-3 mx-2 rounded-xl" href="#">
<span class="material-symbols-outlined duotone-icon" data-icon="calendar_today">calendar_today</span> Schedules
            </a>
<a class="bg-white/10 backdrop-blur-md text-primary-fixed border-l-4 border-primary shadow-[inset_0_0_12px_rgba(0,242,255,0.2)] rounded-r-xl py-3 px-4 flex items-center gap-3 mr-2" href="#">
<span class="material-symbols-outlined duotone-icon" data-icon="analytics" style="font-variation-settings: 'FILL' 1;">analytics</span> Clinical Data
            </a>
<a class="text-on-surface-variant hover:text-on-surface py-3 px-4 transition-all hover:bg-white/5 flex items-center gap-3 mx-2 rounded-xl" href="#">
<span class="material-symbols-outlined duotone-icon" data-icon="settings">settings</span> System Config
            </a>
</div>
</nav>
<!-- Main Workspace -->
<div class="md:ml-[280px] w-full md:w-[calc(100%-280px)] flex flex-col relative z-10 min-h-screen">
<!-- TopNavBar Component -->
<header class="sticky top-0 bg-white/10 backdrop-blur-[20px] border-b border-white/10 shadow-sm flex justify-between items-center px-gutter h-20 z-40 transition-all duration-150">
<div class="flex items-center gap-stack-md">
<h2 class="font-headline-md text-headline-md text-on-surface font-semibold tracking-tight">Reports &amp; Analytics</h2>
</div>
<div class="flex items-center gap-stack-md">
<!-- Date Range Glass Picker -->
<button class="flex items-center gap-2 bg-white/15 backdrop-blur-[40px] border border-white/10 rounded-full px-4 py-2 font-label-sm text-label-sm text-on-surface hover:bg-white/20 hover:border-primary/50 transition-all shadow-[inset_0_0_8px_rgba(255,255,255,0.05)]">
<span class="material-symbols-outlined text-[16px] text-primary-fixed">calendar_month</span>
<span>Q3 2023: Jul 1 - Sep 30</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">arrow_drop_down</span>
</button>
<div class="h-6 w-[1px] bg-white/10 mx-2"></div>
<button class="text-on-surface-variant hover:text-primary transition-colors active:scale-95 p-2 rounded-full hover:bg-white/5">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors active:scale-95 p-2 rounded-full hover:bg-white/5">
<span class="material-symbols-outlined">settings</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors active:scale-95 p-2 rounded-full hover:bg-white/5">
<span class="material-symbols-outlined">apps</span>
</button>
<div class="w-8 h-8 rounded-full bg-surface-variant border border-white/20 overflow-hidden ml-2 shadow-[0_0_10px_rgba(0,219,231,0.2)]">

</div>
</div>

<!-- Content Canvas -->
<main class="flex-1 p-margin-page max-w-container-max mx-auto w-full">
<!-- 3-Column Bento Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-stack-lg auto-rows-[380px]">
<!-- Widget 1: Visits by Territory (Heatmap approx) -->
<div class="col-span-1 lg:col-span-2 relative bg-white/20 backdrop-blur-[40px] border border-white/15 rounded-xl p-stack-md shadow-[inset_0_0_8px_1px_rgba(0,219,231,0.1)] overflow-hidden group flex flex-col">
<!-- Glow Blobs -->
<div class="absolute -top-12 -left-12 w-32 h-32 bg-primary/20 rounded-full blur-[40px] opacity-40 group-hover:opacity-70 transition-opacity duration-500"></div>
<div class="absolute -bottom-12 -right-12 w-32 h-32 bg-secondary-container/20 rounded-full blur-[40px] opacity-40 group-hover:opacity-70 transition-opacity duration-500"></div>
<div class="flex justify-between items-start relative z-10 mb-stack-md">
<div>
<h3 class="font-body-lg text-body-lg text-on-surface font-semibold tracking-wide">Visits by Territory</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Geospatial concentration</p>
</div>
<button class="text-on-surface-variant hover:text-primary-fixed transition-colors p-1 rounded-full hover:bg-white/10">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
<div class="flex-1 relative z-10 rounded-lg overflow-hidden border border-white/5 bg-surface-dim/30 flex items-center justify-center">

</div>
</div>

<div class="absolute -top-8 -right-8 w-24 h-24 bg-primary-container/20 rounded-full blur-[30px] opacity-50 group-hover:opacity-80 transition-opacity duration-500"></div>

<div>

<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
<div class="flex-1 relative z-10 flex flex-col justify-end pb-4 pt-8">
<div class="font-kpi-value text-kpi-value text-transparent bg-clip-text bg-gradient-to-r from-primary-fixed to-secondary-container mb-auto drop-shadow-[0_0_12px_rgba(0,219,231,0.3)]">68.4%</div>
<!-- Mock Line -->
<div class="h-24 w-full relative">
<svg class="w-full h-full" preserveaspectratio="none" viewbox="0 0 100 40">
<path class="drop-shadow-[0_8px_8px_rgba(0,219,231,0.4)]" d="M0,30 Q10,10 20,25 T40,15 T60,35 T80,5 T100,20" fill="none" stroke="url(#lineGrad)" stroke-width="2"></path>
<defs>
<lineargradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#00dbe7"></stop>
<stop offset="100%" stop-color="#7000ff"></stop>
</lineargradient>
</defs>
</svg>
</div>
</div>
</div>
</div>
</main>
</div>
</body></html>
