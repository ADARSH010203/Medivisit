<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>MediVisit Pro - Share Product</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#575c76",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#dce2f3",
                        "on-tertiary-container": "#fffeff",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#c1c5e3",
                        "on-surface": "#151c27",
                        "on-primary-container": "#fffeff",
                        "inverse-primary": "#b3c5ff",
                        "secondary-fixed": "#68fadd",
                        "on-tertiary-fixed": "#151a31",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "on-background": "#151c27",
                        "primary-fixed-dim": "#b3c5ff",
                        "on-surface-variant": "#424655",
                        "outline-variant": "#c2c6d8",
                        "on-secondary": "#ffffff",
                        "secondary": "#006b5c",
                        "surface-tint": "#0055d5",
                        "surface-container-high": "#e2e8f8",
                        "surface-dim": "#d3daea",
                        "on-primary-fixed-variant": "#003fa4",
                        "on-primary-fixed": "#001849",
                        "on-secondary-fixed-variant": "#005145",
                        "on-secondary-fixed": "#00201a",
                        "on-secondary-container": "#007261",
                        "surface": "#f9f9ff",
                        "secondary-container": "#68fadd",
                        "surface-bright": "#f9f9ff",
                        "primary": "#0053d3",
                        "inverse-surface": "#2a313d",
                        "primary-fixed": "#dae1ff",
                        "surface-variant": "#dce2f3",
                        "primary-container": "#1a6bff",
                        "tertiary-fixed": "#dde1ff",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#ebf1ff",
                        "outline": "#727687",
                        "surface-container": "#e7eefe",
                        "background": "#f9f9ff",
                        "error": "#ba1a1a",
                        "tertiary-container": "#707490",
                        "on-tertiary-fixed-variant": "#41455f",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#44ddc1",
                        "surface-container-low": "#f0f3ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "edge": "20px",
                        "stack-md": "16px",
                        "stack-lg": "24px",
                        "base": "4px",
                        "card-padding": "16px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "stats-lg": ["Inter"],
                        "display": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "stats-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "21px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-sheet {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255,255,255,0.5);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }
        
        .glass-button:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.9);
        }

        .glow-whatsapp { box-shadow: 0 4px 16px rgba(37, 211, 102, 0.15); border-color: rgba(37, 211, 102, 0.2); }
        .glow-email { box-shadow: 0 4px 16px rgba(0, 83, 211, 0.15); border-color: rgba(0, 83, 211, 0.2); }
        .glow-sms { box-shadow: 0 4px 16px rgba(112, 116, 144, 0.15); border-color: rgba(112, 116, 144, 0.2); }
        .glow-link { box-shadow: 0 4px 16px rgba(104, 250, 221, 0.2); border-color: rgba(104, 250, 221, 0.3); }

        .sheet-up-anim {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .overlay-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(4px); }
        }
        
        /* Custom Toggle */
        .toggle-checkbox:checked {
            background-color: transparent;
            background-image: linear-gradient(to right, #0053d3, #68fadd);
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #0053d3;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: transparent;
        }
        .toggle-checkbox:checked + .toggle-label:after {
            transform: translateX(100%);
            border-color: white;
        }

        /* Prevent scroll on body when sheet is open */
        body { overflow: hidden; }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen relative">
<!-- Blurred Background Context (Simulating the screen behind) -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="p-edge opacity-40 blur-sm flex flex-col gap-stack-lg mt-16">
<div class="h-64 bg-surface-container rounded-xl"></div>
<div class="h-8 w-3/4 bg-surface-container rounded-lg"></div>
<div class="h-32 bg-surface-container rounded-xl"></div>
<div class="h-32 bg-surface-container rounded-xl"></div>
</div>
</div>
<!-- Backdrop Overlay -->
<div class="fixed inset-0 bg-on-surface/40 z-40 overlay-fade-in flex items-end justify-center sm:p-edge">
<!-- Bottom Sheet Container -->
<div class="glass-sheet w-full max-w-md rounded-t-[24px] sm:rounded-[24px] flex flex-col relative sheet-up-anim overflow-hidden z-50 max-h-[90vh]">
<!-- Upward Glow Top Edge Effect -->
<div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-primary/0 via-primary/20 to-primary/0"></div>
<!-- Drag Handle Area -->
<div class="w-full flex justify-center pt-3 pb-2 cursor-grab active:cursor-grabbing">
<div class="w-12 h-1.5 rounded-full bg-outline-variant/50"></div>
</div>
<!-- Header -->
<div class="px-edge pb-stack-md flex justify-between items-center shrink-0">
<h2 class="font-headline-md text-headline-md text-on-surface">Share Product</h2>
<button aria-label="Close" class="w-8 h-8 rounded-full glass-button flex items-center justify-center text-on-surface-variant hover:text-on-surface">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Scrollable Content Area -->
<div class="px-edge pb-edge overflow-y-auto flex flex-col gap-stack-lg">
<!-- Product Preview Card -->
<div class="glass-card rounded-xl p-3 flex items-center gap-3">
<div class="w-16 h-16 rounded-lg bg-surface-container-lowest overflow-hidden shrink-0 border border-outline-variant/30 flex items-center justify-center">
<img alt="LipoStat Product" class="w-full h-full object-cover object-center mix-blend-multiply" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDnh7WyJPF7F4VzQ4FvVmaU-d-Br3Tj_BKzwnPqKmwZO23_AYNNcL8BL2a1xeomXLSMyGX8SbI6ltYULZeRRDntWxf6XcahWur0DEij72GRNP0HkDCmgBo5IiczcqSHN3jJUwleNvVV6xa7tmX0PbuT-uTH_GghIxGKqfe0es8hkZToZQf6-7KUU6DqDn2fHjkCwgRg1F2xqaVgNpuHoHvNI8krxirk51_-MAZssuuI5KrkfFGfLfqf7gVU1pGNuBr8oMspDq5voAs2"/>
</div>
<div class="flex flex-col flex-1 min-w-0">
<h3 class="font-label-sm text-label-sm text-on-surface truncate text-base">LipoStat</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-xs truncate mt-0.5">Lipid-lowering agent • 20mg • 30 Tabs</p>
<div class="flex items-center gap-1 mt-1.5">
<span class="px-2 py-0.5 rounded-full bg-secondary/10 text-secondary font-label-sm text-[10px]">In Stock</span>
</div>
</div>
</div>
<!-- Share Action Options -->
<div class="flex flex-col gap-stack-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant px-1 uppercase tracking-wider text-[10px]">Share Via</span>
<div class="flex justify-between items-center px-2">
<!-- WhatsApp -->
<div class="flex flex-col items-center gap-2 group cursor-pointer">
<div class="w-14 h-14 rounded-full glass-button glow-whatsapp flex items-center justify-center group-hover:-translate-y-1 transition-transform">
<span class="material-symbols-outlined text-[28px]" style="color: #25D366;">chat</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-[11px]">WhatsApp</span>
</div>
<!-- Email -->
<div class="flex flex-col items-center gap-2 group cursor-pointer">
<div class="w-14 h-14 rounded-full glass-button glow-email flex items-center justify-center group-hover:-translate-y-1 transition-transform">
<span class="material-symbols-outlined text-[28px] text-primary">mail</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-[11px]">Email</span>
</div>
<!-- SMS -->
<div class="flex flex-col items-center gap-2 group cursor-pointer">
<div class="w-14 h-14 rounded-full glass-button glow-sms flex items-center justify-center group-hover:-translate-y-1 transition-transform">
<span class="material-symbols-outlined text-[28px] text-tertiary">sms</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-[11px]">SMS</span>
</div>
<!-- Copy Link -->
<div class="flex flex-col items-center gap-2 group cursor-pointer">
<div class="w-14 h-14 rounded-full glass-button glow-link flex items-center justify-center group-hover:-translate-y-1 transition-transform">
<span class="material-symbols-outlined text-[28px] text-secondary">link</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-[11px]">Copy Link</span>
</div>
</div>
</div>
<div class="h-px bg-outline-variant/30 w-full"></div>
<!-- Attachments Toggle -->
<div class="flex items-center justify-between px-1">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-error-container/50 flex items-center justify-center text-error">
<span class="material-symbols-outlined text-[18px]">picture_as_pdf</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface">Attach Brochure PDF</span>
<span class="font-body-md text-[11px] text-on-surface-variant">2.4 MB • Clinical Overview</span>
</div>
</div>
<!-- Custom Toggle Switch -->
<div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-2 border-outline-variant appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out" id="toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-5 rounded-full bg-surface-container-high cursor-pointer transition-colors duration-200 ease-in-out" for="toggle"></label>
</div>
</div>
<!-- Personal Note -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="personal-note">Personal Note (Optional)</label>
<textarea class="w-full glass-card rounded-xl border-outline-variant/40 focus:border-primary/50 focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md placeholder:text-on-surface-variant/50 p-3 resize-none bg-surface-container-lowest/50" id="personal-note" placeholder="Hi Dr. Smith, here is the information on LipoStat we discussed..." rows="2"></textarea>
</div>
<!-- Send Action Button -->
<button class="w-full h-12 mt-2 rounded-xl bg-gradient-to-r from-primary to-surface-tint text-on-primary font-label-sm text-label-sm flex items-center justify-center gap-2 shadow-[0_4px_14px_rgba(0,83,211,0.3)] hover:shadow-[0_6px_20px_rgba(0,83,211,0.4)] transition-all active:scale-[0.98]">
<span>Send Package</span>
<span class="material-symbols-outlined text-[18px]">send</span>
</button>
</div>
</div>
</div>
</body></html>
