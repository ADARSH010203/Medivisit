<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Edit Profile - MediVisit Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed": "#151a31",
                    "outline": "#727687",
                    "tertiary-container": "#707490",
                    "on-error": "#ffffff",
                    "secondary": "#006b5c",
                    "on-primary-fixed": "#001849",
                    "on-primary-container": "#fffeff",
                    "error-container": "#ffdad6",
                    "on-tertiary-container": "#fffeff",
                    "error": "#ba1a1a",
                    "background": "#f9f9ff",
                    "surface-container-highest": "#dce2f3",
                    "primary-fixed-dim": "#b3c5ff",
                    "on-tertiary": "#ffffff",
                    "surface-tint": "#0055d5",
                    "primary": "#0053d3",
                    "surface-bright": "#f9f9ff",
                    "tertiary": "#575c76",
                    "on-secondary-fixed": "#00201a",
                    "inverse-on-surface": "#ebf1ff",
                    "inverse-surface": "#2a313d",
                    "primary-container": "#1a6bff",
                    "outline-variant": "#c2c6d8",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed-variant": "#41455f",
                    "inverse-primary": "#b3c5ff",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed": "#dde1ff",
                    "surface-container": "#e7eefe",
                    "secondary-fixed-dim": "#44ddc1",
                    "on-surface-variant": "#424655",
                    "surface-dim": "#d3daea",
                    "on-secondary-container": "#007261",
                    "tertiary-fixed-dim": "#c1c5e3",
                    "on-background": "#151c27",
                    "secondary-container": "#68fadd",
                    "surface-variant": "#dce2f3",
                    "on-primary-fixed-variant": "#003fa4",
                    "surface-container-low": "#f0f3ff",
                    "surface": "#f9f9ff",
                    "on-surface": "#151c27",
                    "on-error-container": "#93000a",
                    "secondary-fixed": "#68fadd",
                    "on-secondary-fixed-variant": "#005145",
                    "primary-fixed": "#dae1ff",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-high": "#e2e8f8"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-lg": "24px",
                    "edge": "20px",
                    "stack-sm": "8px",
                    "stack-md": "16px",
                    "card-padding": "16px",
                    "base": "4px"
            },
            "fontFamily": {
                    "display": ["Inter"],
                    "stats-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "display": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "stats-lg": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-lg": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-md": ["14px", {"lineHeight": "21px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }
        
        .glass-input:focus-within {
            border-color: #1a6bff;
            box-shadow: 0 0 0 2px rgba(26, 107, 255, 0.2);
            background: #ffffff;
        }

        .floating-label-group {
            position: relative;
        }

        .floating-label {
            position: absolute;
            left: 48px;
            top: 50%;
            transform: translateY(-50%);
            transition: all 0.2s ease;
            pointer-events: none;
            color: #727687; /* outline */
        }

        .glass-input:focus-within .floating-label,
        .glass-input input:not(:placeholder-shown) ~ .floating-label,
        .glass-input select:not(:placeholder-shown) ~ .floating-label {
            top: 12px;
            font-size: 10px;
            color: #1a6bff; /* primary-container */
        }
        
        .read-only-input {
            background: rgba(226, 232, 248, 0.5); /* surface-container-high with opacity */
            cursor: not-allowed;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen pb-stack-lg">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 bg-surface/70 backdrop-blur-xl border-b-[1.5px] border-outline-variant/30 h-16 flex items-center px-4 justify-between shadow-[0_8px_32px_rgba(0,0,0,0.04)]">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-primary">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Edit Profile</h1>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<main class="pt-24 px-edge max-w-[600px] mx-auto pb-32">
<!-- Profile Photo Edit -->
<div class="flex flex-col items-center mb-stack-lg relative">
<div class="relative w-32 h-32 rounded-full p-1 bg-gradient-to-tr from-primary-container to-secondary-container shadow-[0_0_20px_rgba(26,107,255,0.3)]">
<img class="w-full h-full object-cover rounded-full border-4 border-surface border-white" data-alt="A professional headshot of a modern medical representative, male, South Asian descent, looking confident and approachable, wearing a sharp business casual suit in a well-lit modern corporate environment with soft cool lighting. Corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCMRKcMqtxxKb9Np7qbvkGY4dPJSKd8T6GCxluzoYZWDwnle10iruU7IjqWW7ZFtHdCUiKgm_Wvhk3G19g7qpBMFVA0FlEXkcPZMWIC00wemw9BtFXaOLpSkZsHgXmKkXn-JqA-qI308BuEW66pcVhCullbZwIiTehVVtCFlmMxkhfaTPrhOjQbbYEQpPOrzgptu4_Inu7k53USKX3W4DqJaLMVrIn1pKraTbo3J254HkzwvE5hhqVQZwL6TWR3Y4ESMqxPAGh-wux3"/>
<button class="absolute bottom-0 right-0 w-10 h-10 rounded-full bg-white/80 backdrop-blur-md border border-white flex items-center justify-center shadow-lg hover:scale-105 transition-transform text-primary-container">
<span class="material-symbols-outlined text-[20px]" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-outline mt-stack-sm uppercase tracking-wider">Tap to change</p>
</div>
<!-- Form Fields -->
<form class="space-y-stack-md">
<!-- Full Name -->
<div class="glass-card rounded-lg p-1 glass-input transition-all">
<div class="relative flex items-center h-14 bg-white/50 rounded-md px-3">
<span class="material-symbols-outlined text-outline mr-3" data-icon="person">person</span>
<input class="w-full bg-transparent border-none outline-none focus:ring-0 text-on-surface font-body-lg text-body-lg pt-4 pb-1 px-0 z-10" id="fullName" placeholder=" " required="" type="text" value="Rahul Sharma"/>
<label class="floating-label font-body-md text-body-md" for="fullName">Full Name</label>
</div>
</div>
<!-- Phone -->
<div class="glass-card rounded-lg p-1 glass-input transition-all">
<div class="relative flex items-center h-14 bg-white/50 rounded-md px-3">
<span class="material-symbols-outlined text-outline mr-3" data-icon="phone_iphone">phone_iphone</span>
<input class="w-full bg-transparent border-none outline-none focus:ring-0 text-on-surface font-body-lg text-body-lg pt-4 pb-1 px-0 z-10" id="phone" placeholder=" " required="" type="tel" value="+91 98765 43210"/>
<label class="floating-label font-body-md text-body-md" for="phone">Phone Number</label>
</div>
</div>
<!-- Email (Read-Only) -->
<div class="glass-card rounded-lg p-1 read-only-input">
<div class="relative flex items-center h-14 rounded-md px-3">
<span class="material-symbols-outlined text-outline mr-3" data-icon="mail">mail</span>
<div class="flex-1">
<label class="block text-[10px] text-outline font-semibold mb-[-2px]">Email Address</label>
<input class="w-full bg-transparent border-none outline-none focus:ring-0 text-on-surface-variant font-body-lg text-body-lg p-0" readonly="" type="email" value="rahul.s@umakind.com"/>
</div>
<span class="material-symbols-outlined text-outline/50 ml-2 text-[18px]" data-icon="lock">lock</span>
</div>
</div>
<!-- Territory Dropdown -->
<div class="glass-card rounded-lg p-1 glass-input transition-all">
<div class="relative flex items-center h-14 bg-white/50 rounded-md px-3">
<span class="material-symbols-outlined text-outline mr-3" data-icon="location_on">location_on</span>
<select class="w-full bg-transparent border-none outline-none focus:ring-0 text-on-surface font-body-lg text-body-lg pt-4 pb-1 px-0 z-10 appearance-none" id="territory">
<option selected="" value="nw_mumbai">Northwest Mumbai</option>
<option value="s_mumbai">South Mumbai</option>
<option value="e_suburbs">Eastern Suburbs</option>
<option value="thane">Thane District</option>
</select>
<label class="absolute left-12 top-2 text-[10px] text-primary-container transition-all" for="territory">Territory</label>
<span class="material-symbols-outlined text-outline absolute right-3 pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Emergency Contact -->
<div class="glass-card rounded-lg p-1 glass-input transition-all mt-stack-lg">
<div class="px-4 py-2 border-b border-outline-variant/30">
<h3 class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Emergency Contact</h3>
</div>
<div class="relative flex items-center h-14 bg-white/50 rounded-b-md px-3">
<span class="material-symbols-outlined text-outline mr-3" data-icon="emergency">emergency</span>
<input class="w-full bg-transparent border-none outline-none focus:ring-0 text-on-surface font-body-lg text-body-lg pt-4 pb-1 px-0 z-10" id="emergencyName" placeholder=" " required="" type="text" value="Priya Sharma (Wife)"/>
<label class="floating-label font-body-md text-body-md" for="emergencyName">Name &amp; Relation</label>
</div>
<div class="relative flex items-center h-14 bg-white/50 rounded-b-md px-3 border-t border-outline-variant/20">
<span class="material-symbols-outlined text-outline mr-3" data-icon="call">call</span>
<input class="w-full bg-transparent border-none outline-none focus:ring-0 text-on-surface font-body-lg text-body-lg pt-4 pb-1 px-0 z-10" id="emergencyPhone" placeholder=" " required="" type="tel" value="+91 98765 00000"/>
<label class="floating-label font-body-md text-body-md" for="emergencyPhone">Contact Number</label>
</div>
</div>
</form>
</main>
<!-- Sticky Bottom Action -->
<div class="fixed bottom-0 left-0 right-0 p-edge bg-gradient-to-t from-surface via-surface/90 to-transparent z-40">
<div class="max-w-[600px] mx-auto">
<button class="w-full h-12 rounded-lg bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline-md text-headline-md shadow-[0_4px_15px_rgba(26,107,255,0.4)] hover:shadow-[0_6px_20px_rgba(26,107,255,0.6)] hover:scale-[1.02] transition-all flex items-center justify-center">
                Save Changes
            </button>
</div>
</div>
</body></html>
