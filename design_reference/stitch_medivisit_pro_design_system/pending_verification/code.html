<main class="flex-grow flex flex-col items-center justify-center px-edge py-stack-lg max-w-lg mx-auto w-full relative z-10">

<div class="absolute -bottom-2 -right-2 bg-background rounded-full p-1">
<div class="bg-secondary-container rounded-full w-8 h-8 flex items-center justify-center">
<span class="material-symbols-outlined text-[20px] text-on-secondary-container" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</div>

<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto">

            </p>
</div>

<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-tertiary uppercase tracking-wider">Name</span>
<span class="font-body-md text-body-md text-on-surface font-semibold">Dr. Sarah Jenkins</span>
</div>
</div>
<div class="flex items-center gap-stack-md border-b border-surface-variant pb-stack-sm">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>

<span class="font-label-sm text-label-sm text-tertiary uppercase tracking-wider">Email</span>
<span class="font-body-md text-body-md text-on-surface font-semibold">s.jenkins@pulseconnect.med</span>
</div>
</div>

<span class="material-symbols-outlined text-outline" data-icon="calendar_today">calendar_today</span>

</div>
</div>
</div>
</div>

<button class="w-full h-[48px] rounded-lg border border-outline text-primary font-label-sm text-label-sm flex items-center justify-center hover:bg-surface-container-highest transition-colors">
