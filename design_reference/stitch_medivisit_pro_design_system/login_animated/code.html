<!DOCTYPE html>

<html lang="en"><head>

                    "fontFamily": {

<style>
        .mesh-bg {
            background-color: #F7F9FC;
            background-image: 
                radial-gradient(at 40% 20%, #EEF2FA 0px, transparent 50%),
                radial-gradient(at 80% 0%, #e9ddff 0px, transparent 50%),
                radial-gradient(at 0% 50%, #EEF2FA 0px, transparent 50%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }
        .input-glass {
            background: rgba(241, 245, 249, 0.6);
            border: 1px solid transparent;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .input-glass:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
            outline: none;
        }
        .primary-btn {
            background: linear-gradient(135deg, #4f378a 0%, #6750a4 100%);
            box-shadow: 0 4px 14px rgba(79, 55, 138, 0.3);
            position: relative;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        }
        .primary-btn:active {
            transform: scale(0.96);
            box-shadow: 0 0 24px rgba(79, 55, 138, 0.6);
        }
        .primary-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
        }

        /* Animations */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-entrance {
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        .delay-50 { animation-delay: 50ms; }
        .delay-100 { animation-delay: 100ms; }
        .delay-150 { animation-delay: 150ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-250 { animation-delay: 250ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-350 { animation-delay: 350ms; }
        .delay-400 { animation-delay: 400ms; }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-badge {
            position: relative;
            overflow: hidden;
        }
        .shimmer-badge::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 3s infinite linear;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen mesh-bg flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop text-on-surface font-body-lg">
<!-- Note: TopAppBar and BottomNavBar are suppressed as this is a linear transactional login screen -->
<div class="w-full max-w-md relative z-10 flex flex-col items-center">
<!-- Header -->
<div class="mb-8 text-center flex flex-col items-center">
<img alt="UMAKIND Pharma Logo" class="h-16 w-auto mb-6 rounded-lg shadow-sm animate-entrance" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEEbUT4aH4YPs03xUojrpH5uwH7QJgiQcKRWgWPQc7VUKuabmpCONK5o3uN0W_gn-yqaE2a-OySvOrG6Psor8dOvtreo5w-3taiY7QkepcdrxFSbfQssbpHq_o1A4RgW7oL5FMA8F7KFwoA7HY6r60vAkagMQ-il3hsc1fd5E4dZLFdZDvCGdjDi0YB65y1rq9Z47KXv_BWWahnSs8ro8Yb3J66YqUipk04KKJ9AyGFPcR4-xgaXEl_QvdqKCyom9j5bNaioBTlJ6X"/>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface animate-entrance delay-50">Welcome back</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-2 animate-entrance delay-100">Sign in to MediVisit Pro</p>
</div>
<!-- Glass Card -->
<div class="glass-card w-full rounded-2xl p-6 md:p-8 relative overflow-hidden animate-entrance delay-150">
<!-- Subtle internal glow -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/5 rounded-full blur-2xl pointer-events-none"></div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2 animate-entrance delay-200">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-primary/70" style="font-variation-settings: 'FILL' 0;">mail</span>
</div>
<input class="input-glass w-full rounded-lg py-3 pl-10 pr-4 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50" id="email" placeholder="rep@umakind.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2 animate-entrance delay-250">
<div class="flex justify-between items-center">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-primary/70" style="font-variation-settings: 'FILL' 0;">lock</span>
</div>
<input class="input-glass w-full rounded-lg py-3 pl-10 pr-4 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="primary-btn animate-entrance delay-300 w-full rounded-lg py-3 mt-4 flex items-center justify-center font-title-md text-title-md text-on-primary hover:opacity-90 transition-opacity" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined ml-2" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Links -->
<div class="mt-8 text-center space-y-4 animate-entrance delay-350">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                New Employee? <a class="text-primary font-title-md text-title-md hover:underline" href="#">Register here</a>
</p>
<!-- Secure Badge -->
<div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container/50 border border-outline-variant/30 backdrop-blur-sm mt-4 shimmer-badge animate-entrance delay-400">
<div class="relative">
<span class="material-symbols-outlined text-tertiary-container text-sm" style="font-variation-settings: 'FILL' 1;">shield_locked</span>
<div class="absolute inset-0 bg-tertiary-container/30 blur-sm rounded-full"></div>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Secure company login</span>
</div>
</div>
</div>
</body></html>
