<style>
        /* Base Styles & Mesh Gradient */
        body {
            background-color: #fdf7ff; /* surface */
            position: relative;
            overflow: hidden; /* Prevent scrolling on splash/onboarding */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Mesh Gradient Background - Level 0 Base */
        .mesh-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            overflow: hidden;
            background: #ffffff;
        }

        .mesh-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 20s infinite ease-in-out alternate;
        }

        .mesh-blob-1 {
            width: 600px;
            height: 600px;
            background: #4f378a; /* primary */
            top: -100px;
            left: -100px;
        }

        .mesh-blob-2 {
            width: 500px;
            height: 500px;
            background: #0ea5e9; /* teal/blue accent */
            bottom: -50px;
            right: -100px;
            animation-delay: -5s;
        }
        
        .mesh-blob-3 {
            width: 400px;
            height: 400px;
            background: #e7c365; /* tertiary */
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -50px) scale(1.1); }
            100% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }

        .glass-button-secondary {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        
        /* Typography specifics */
        .inter-display {
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.04em;
        }
    </style>
</head>
<body class="text-on-surface flex flex-col h-screen max-h-screen">
<!-- Ambient Background -->

<div class="mesh-blob mesh-blob-1"></div>

<!-- Top Navigation (Skip Button) -->

</header>
<!-- Main Canvas Content -->
<main class="flex-1 flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop z-10 relative -mt-12 md:mt-0">
<!-- Illustration Container -->
<div class="relative w-full max-w-sm aspect-square mb-8 md:mb-12 flex justify-center items-center">
<!-- Decorative Glow behind image -->

</div>
<!-- Text Content -->
<div class="text-center max-w-md mx-auto px-4">
<h1 class="font-display-hero text-headline-lg-mobile md:text-headline-lg text-primary inter-display mb-4">
                Log Visits in Seconds
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm mx-auto">
                Capture doctor visits with one tap — location and time recorded automatically.

</button>
</footer>
